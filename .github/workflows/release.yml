name: Build & Release Bilnov Gallery Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag'
        required: false
        default: 'v2.2.0'

permissions:
  contents: write

jobs:

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build Windows Executable with PyInstaller
        run: |
          pyinstaller --clean -y bilnov_gallery.spec

      - name: Build orga+ Copy Tool with PyInstaller
        run: |
          pyinstaller --clean -y orga_copy_tool.spec

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build orga+ Windows Installer
        shell: pwsh
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc installer/orga_plus.iss
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/orga_plus.iss
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files\Inno Setup 6\ISCC.exe" installer/orga_plus.iss
          } else {
            throw "ISCC compiler not found"
          }
          Get-ChildItem dist

      - name: Package Windows Binary
        shell: pwsh
        run: |
          # Package installer and supplementary files
          Compress-Archive -Path dist/orga+-Portable -DestinationPath dist/orga+-Windows-Portable.zip -Force
          Get-ChildItem dist

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/orga+_Setup.exe
            dist/orga+.exe
            dist/orga+-Windows-Portable.zip
            dist/orga+ Copy Tool.exe

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name || 'v2.2.0' }}
          name: "orga+ Desktop ${{ github.ref_name || inputs.tag_name || 'v2.2.0' }}"
          draft: false
          prerelease: false
          body: |
            ## What's New in v2.2.0

            ### Windows Installer
            - Replaced the portable exe with a standard Windows installer (`orga+_Setup.exe`).
            - Added checkboxes during installation to create a desktop shortcut, a taskbar shortcut, or both.
            - Added clean uninstallation support registered in Windows Settings > Apps.
            - Added in-app option to generate desktop/taskbar shortcuts at any time.

            ### File Importing
            - Importing assets or folders now uses their original absolute file path instead of copying them to internal storage.
            - Prevents duplicating large 3D models and textures on disk.
            - "Open location" now opens the actual source folder on disk.
            - Deleting an imported asset removes it from the library without touching your original files.

            ### Other Improvements
            - orga+ Copy Tool now detects and copies the setup installer to USB drives instead of the portable binary.
          files: |
            dist/orga+_Setup.exe
            dist/orga+.exe
            dist/orga+-Windows-Portable.zip
            dist/orga+ Copy Tool.exe
