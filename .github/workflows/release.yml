name: Build & Release Bilnov Gallery Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build Windows Executable with PyInstaller
        run: |
          pyinstaller --clean -y bilnov_gallery.spec

      - name: Package Windows Binary
        shell: pwsh
        run: |
          # Compress portable directory containing all DLLs and runtime files
          Compress-Archive -Path dist/BilnovGallery-Portable -DestinationPath dist/BilnovGallery-Windows-Portable.zip -Force
          # Note: dist/BilnovGallery.exe is the standalone single-file executable built by PyInstaller
          # with embedded python DLL, Qt runtime, and assets.
          Get-ChildItem dist

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/BilnovGallery.exe
            dist/BilnovGallery-Windows-Portable.zip

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Bilnov Gallery Desktop ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/BilnovGallery.exe
            dist/BilnovGallery-Windows-Portable.zip
