name: Build & Release Bilnov Gallery Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS App with PyInstaller
        run: |
          pyinstaller --clean -y bilnov_gallery.spec

      - name: Create DMG and ZIP packages
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/BilnovGallery.app dist/BilnovGallery-macOS.zip
          hdiutil create -volname "Bilnov Gallery" -srcfolder dist/BilnovGallery.app -ov -format UDZO dist/BilnovGallery-macOS.dmg

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: |
            dist/BilnovGallery-macOS.dmg
            dist/BilnovGallery-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows Executable with PyInstaller
        run: |
          pyinstaller --clean -y bilnov_gallery.spec

      - name: Package Windows Binary
        shell: pwsh
        run: |
          Compress-Archive -Path dist/BilnovGallery -DestinationPath dist/BilnovGallery-Windows.zip -Force
          Copy-Item dist/BilnovGallery/BilnovGallery.exe dist/BilnovGallery.exe -ErrorAction SilentlyContinue

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/BilnovGallery-Windows.zip
            dist/BilnovGallery.exe

  publish-release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Inspect release assets
        run: |
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Bilnov Gallery Desktop ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/BilnovGallery-macOS.dmg
            release-assets/BilnovGallery-macOS.zip
            release-assets/BilnovGallery-Windows.zip
            release-assets/BilnovGallery.exe
