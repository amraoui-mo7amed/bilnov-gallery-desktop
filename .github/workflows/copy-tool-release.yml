name: Build & Release orga+ Copy Tool

on:
  push:
    tags:
      - 'copytool-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build orga+ Copy Tool (Windows) with PyInstaller
        run: |
          pyinstaller --clean -y orga_copy_tool.spec

      - name: Show build output
        shell: pwsh
        run: Get-ChildItem dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: copy-tool-windows
          path: dist/orga+ Copy Tool.exe

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "orga+ Copy Tool ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/orga+ Copy Tool.exe
